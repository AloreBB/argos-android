name: Release APK

# Every push to main (PR merges included) runs semantic-release (.releaserc.json): it reads the
# Conventional Commits since the last vX.Y.Z tag, picks the version, updates CHANGELOG.md, builds and
# signs the APK (scripts/build-release-apk.sh) and publishes it on a GitHub Release.
# docs/ci/test/chore-only pushes publish nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, never cancelled: a queued run sees the tag the previous one created.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing key
        env:
          ARGOS_KEYSTORE_BASE64: ${{ secrets.ARGOS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ARGOS_KEYSTORE_BASE64" ]; then
            echo "::error::Missing ARGOS_KEYSTORE_BASE64 secret: refusing to publish an APK signed with a throwaway key."
            exit 1
          fi
          echo "$ARGOS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ARGOS_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARGOS_KEYSTORE_PASSWORD: ${{ secrets.ARGOS_KEYSTORE_PASSWORD }}
          ARGOS_KEY_ALIAS: ${{ secrets.ARGOS_KEY_ALIAS }}
          ARGOS_KEY_PASSWORD: ${{ secrets.ARGOS_KEY_PASSWORD }}
        run: >
          npx --yes
          -p semantic-release@25.0.9
          -p @semantic-release/exec@7.1.0
          -p @semantic-release/changelog@7.0.0
          -p @semantic-release/git@11.0.1
          -p @semantic-release/github@12.0.10
          -p conventional-changelog-conventionalcommits@9.3.1
          semantic-release
